<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<input type="text" id="in1"><button onclick="check()">send</button>
<p id="ans">result</p>
<body>
    <script>
    //    for (let i =0; i<10;i++){
    //         console(i)
    //     }
     function check(){
         let v =document.getElementById("in1").value
         document.getElementById("ans").innerHTML =""
        for(let i =1; i<=10;i++){

            document.getElementById("ans").innerHTML += `<p>${i} X ${v}=${i*v}</p>`
        
    }
}
         
    </script>
</body>
</html>
